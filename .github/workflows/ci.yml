name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  swift:
    name: swift
    # pdf-cli/translate-cli가 macOS 26 API(RecognizeDocumentsRequest, TranslationSession)를
    # 쓰므로 macos-26이 필요하다. 이 이미지는 arm64 전용이다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path swift/core
      - run: swift build -c release --package-path swift/pdf
      - run: swift build -c release --package-path swift/translate
      - run: swift build -c release --package-path swift/vision
