name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node (bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  swift-core:
    name: swift (SwiftXKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path swift/core
