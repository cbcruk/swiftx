name: Release

# 네 패키지를 npm에 올리고, 태그에 GitHub 릴리스를 만들어 그때의 버전을 남긴다.
# 릴리스에 tarball을 붙이지 않는 이유: docs/design.md#왜-npm이-유일한-배포처인가
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 릴리스 태그 (예 2026.09.03). 이미 있는 태그면 실패한다
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # 바이너리를 동봉해야 하므로 릴리스는 macOS에서만 만든다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build universal binaries
        run: |
          pnpm --filter @cbcruk/pdf-cli build:swift
          pnpm --filter @cbcruk/translate-cli build:swift
          pnpm --filter @cbcruk/vision-ocr build:swift

      # 브리지를 먼저 올려야 래퍼가 선언한 범위가 레지스트리에서 풀린다.
      # prepack 훅이 래퍼마다 동봉 바이너리 유무를 확인하고, pnpm publish가 workspace:
      # 의존성을 실제 버전 범위로 바꿔 쓴다.
      # 같은 버전을 두 번 올리면 npm이 거절하므로, 없을 때만 올린다.
      # 패키지를 고쳤다면 그 package.json의 버전을 먼저 올려야 이 단계가 실제로 배포한다.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in swift-bridge pdf-cli translate-cli vision-ocr; do
            version=$(node -p "require('./packages/${package}/package.json').version")
            if npm view "@cbcruk/${package}@${version}" version >/dev/null 2>&1; then
              echo "@cbcruk/${package}@${version} is already on npm — skipping"
            else
              pnpm --filter "@cbcruk/${package}" publish --access public --no-git-checks
            fi
          done

      - name: Compose release notes
        run: |
          node scripts/release-notes.mjs > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.tag }}" \
            --notes-file release-notes.md
