name: Release

# 바이너리를 동봉하는 래퍼 셋은 GitHub 릴리스에 tarball로 붙이고, 브리지는 npm에 올린다.
# 그 갈래의 이유는 docs/design.md#왜-브리지만-npm에-올리나 에 있다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 릴리스 태그 (예 2026.09.03). 이미 있는 태그면 실패한다
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # 바이너리를 동봉해야 하므로 릴리스는 macOS에서만 만든다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build universal binaries
        run: |
          pnpm --filter @cbcruk/pdf-cli build:swift
          pnpm --filter @cbcruk/translate-cli build:swift
          pnpm --filter @cbcruk/vision-ocr build:swift

      # prepack 훅이 패키지마다 동봉 바이너리 유무를 확인하고, pnpm pack이 workspace:
      # 의존성을 실제 버전 범위로 바꿔 쓴다. 브리지는 npm이 정본이라 여기서 빠진다.
      - name: Pack
        run: |
          mkdir -p tarballs
          for package in pdf-cli translate-cli vision-ocr; do
            pnpm --filter "@cbcruk/${package}" pack --pack-destination "${PWD}/tarballs"
          done
          ls -l tarballs

      # 같은 버전을 두 번 올리면 npm이 거절하므로, 없을 때만 올린다.
      # 브리지를 고쳤다면 package.json의 버전을 먼저 올려야 이 단계가 실제로 배포한다.
      # 릴리스에 브리지 tarball을 붙이지 않는 이유: docs/design.md#왜-브리지만-npm에-올리나
      - name: Publish swift-bridge to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/swift-bridge/package.json').version")
          if npm view "@cbcruk/swift-bridge@${version}" version >/dev/null 2>&1; then
            echo "@cbcruk/swift-bridge@${version} is already on npm — skipping"
          else
            pnpm --filter @cbcruk/swift-bridge publish --access public --no-git-checks
          fi

      - name: Compose release notes
        run: |
          node scripts/release-notes.mjs tarballs \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.tag }}" \
            > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" tarballs/*.tgz \
            --target "${{ github.sha }}" \
            --title "${{ inputs.tag }}" \
            --notes-file release-notes.md
